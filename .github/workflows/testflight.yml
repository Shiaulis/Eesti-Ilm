name: TestFlight

# Manual only: archives the app and uploads a build to TestFlight.
on:
  workflow_dispatch:

permissions:
  contents: read

# Two uploads at once would race for the same build number.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    # The API key secrets live in this environment. It allows only `master` and needs the owner's approval for each run.
    environment: testflight
    # GitHub's Xcode 27 image (public preview). Its default Xcode is 27.1, so 27.2 is selected below.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      # The lane writes the API key to a temporary file for xcodebuild and deletes it when the build ends.
      - name: Archive and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: bundle exec fastlane beta
