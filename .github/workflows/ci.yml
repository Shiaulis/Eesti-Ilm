name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SWIFTFORMAT_VERSION: 0.64.7
  SWIFTFORMAT_SHA256: e82e224325cbd3403fc7b68caf6c917926dc106de3af875fca4b87e3c4634038

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install actionlint

      - name: Lint workflows
        run: actionlint -config-file .github/actionlint.yaml

      - name: Install SwiftFormat
        run: |
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "${{ runner.temp }}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  ${{ runner.temp }}/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "${{ runner.temp }}/swiftformat.zip" -d "${{ runner.temp }}/bin"
          chmod +x "${{ runner.temp }}/bin/swiftformat"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          "${{ runner.temp }}/bin/swiftformat" --version

      - name: Lint Swift
        run: swiftformat --lint .

  build-and-test:
    # GitHub's Xcode 27 image (public preview). Its default Xcode is 27.1, so 27.2 is selected below.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Pick newest iPhone simulator
        id: simulator
        run: |
          name="$(python3 - <<'PY'
          import json, subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "-j"]))

          def version(text):
              return tuple(int(part) for part in text.split("."))

          runtimes = [r for r in simctl("runtimes")["runtimes"]
                      if r.get("platform") == "iOS" and r.get("isAvailable")]
          newest = max(version(r["version"]) for r in runtimes)
          newest_ids = {r["identifier"] for r in runtimes if version(r["version"]) == newest}

          devices = simctl("devices", "available")["devices"]
          available = {d["deviceTypeIdentifier"]
                       for runtime, items in devices.items() if runtime in newest_ids
                       for d in items}

          # `simctl list devicetypes` lists the newest models first.
          for device_type in simctl("devicetypes")["devicetypes"]:
              if device_type.get("productFamily") == "iPhone" and device_type["identifier"] in available:
                  print(device_type["name"])
                  break
          else:
              raise SystemExit("No iPhone simulator found for the newest iOS runtime")
          PY
          )"
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-${{ hashFiles('EstonianWeather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and test
        run: |
          xcodebuild test \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages" \
            -disableAutomaticPackageResolution \
            -project EstonianWeather.xcodeproj \
            -scheme EstonianWeather \
            -testPlan EstonianWeather \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }},OS=latest" \
            -resultBundlePath "${{ runner.temp }}/TestResults.xcresult" \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
