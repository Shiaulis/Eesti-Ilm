name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SWIFTFORMAT_VERSION: 0.64.7
  SWIFTFORMAT_SHA256: e82e224325cbd3403fc7b68caf6c917926dc106de3af875fca4b87e3c4634038

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install actionlint

      - name: Lint workflows
        run: actionlint -config-file .github/actionlint.yaml

      - name: Install SwiftFormat
        run: |
          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "${{ runner.temp }}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  ${{ runner.temp }}/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "${{ runner.temp }}/swiftformat.zip" -d "${{ runner.temp }}/bin"
          chmod +x "${{ runner.temp }}/bin/swiftformat"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          "${{ runner.temp }}/bin/swiftformat" --version

      - name: Lint Swift
        run: swiftformat --lint .

  build-and-test:
    # GitHub's Xcode 27 image (public preview). Its default Xcode is 27.1, so 27.2 is selected below.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Pick newest iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "-j"]))

          def version(text):
              return tuple(int(part) for part in text.split("."))

          runtimes = [r for r in simctl("runtimes")["runtimes"]
                      if r.get("platform") == "iOS" and r.get("isAvailable")]
          newest = max(version(r["version"]) for r in runtimes)
          newest_ids = {r["identifier"] for r in runtimes if version(r["version"]) == newest}

          # One available device per device type on the newest runtime.
          available = {}
          for runtime, items in simctl("devices", "available")["devices"].items():
              if runtime in newest_ids:
                  for device in items:
                      available.setdefault(device["deviceTypeIdentifier"], device)

          # `simctl list devicetypes` lists the newest models first.
          for device_type in simctl("devicetypes")["devicetypes"]:
              if device_type.get("productFamily") == "iPhone" and device_type["identifier"] in available:
                  device = available[device_type["identifier"]]
                  break
          else:
              raise SystemExit("No iPhone simulator found for the newest iOS runtime")

          print(f"Using simulator: {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={device['udid']}\n")
          PY

      # The first boot of a simulator on a fresh runner takes minutes. Start it in the
      # background so it boots while the app builds. Background processes keep running
      # after the step ends; the runner stops them when the job finishes.
      - name: Start booting the simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: nohup xcrun simctl bootstatus "$SIMULATOR_UDID" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      # A generic destination, so the build doesn't wait for the booting simulator.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project EstonianWeather.xcodeproj \
            -scheme EstonianWeather \
            -testPlan EstonianWeather \
            -destination "generic/platform=iOS Simulator" \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO

      # Waits for the boot started above, or boots the simulator if that failed.
      - name: Wait for the simulator to boot
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          cat "$RUNNER_TEMP/simulator-boot.log" || true

      - name: Test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test-without-building \
            -project EstonianWeather.xcodeproj \
            -scheme EstonianWeather \
            -testPlan EstonianWeather \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "${{ runner.temp }}/TestResults.xcresult" \
            -enableCodeCoverage NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
