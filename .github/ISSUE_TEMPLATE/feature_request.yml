name: Feature request
description: Suggest an idea for Eesti Ilm
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Eesti Ilm is a small, solo-maintained app, so not every idea will fit. Describing the problem helps most.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
