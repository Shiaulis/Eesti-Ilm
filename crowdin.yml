# Crowdin configuration for the app's String Catalog (EES-28). Crowdin syncs `master` through its
# GitHub integration (configured in the Crowdin project, not in this repo).
#
# Only Resources/Localizable.xcstrings goes to Crowdin. Settings.bundle (English only)
# and fastlane/metadata (en-US only) stay out of it.

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
pull_request_title: "Update translations from Crowdin"
# Crowdin's default commit message ends with [ci skip], which stops GitHub Actions on its
# PRs. A custom message with append_commit_message: false drops the tag, so CI runs.
commit_message: "Update %language% translations of %original_file_name% from Crowdin"
append_commit_message: false

files:
  # A String Catalog is multilingual: one file holds English and every translation,
  # so source and translation point to the same file.
  # Do not set `dest`: the Crowdin CLI has a known bug with it for multilingual files.
  # English is the source language and must not be a target language in the Crowdin
  # project: downloading it as a target replaced the source text.
  # Crowdin writes every project language into the file, so add a new language in Xcode
  # and in the Crowdin project together. Today Estonian (et) is the only target.
  - source: /Resources/Localizable.xcstrings
    translation: /Resources/Localizable.xcstrings
    multilingual: true
