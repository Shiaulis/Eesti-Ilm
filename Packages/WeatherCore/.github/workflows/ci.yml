name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftFormat lint
    # xcode-27 is the GitHub-hosted arm64 image with macOS 27 and Xcode 27.x (public preview).
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftFormat
        run: |
          command -v swiftformat || brew install swiftformat
          swiftformat --version
      - name: Lint
        run: swiftformat --lint .

  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
