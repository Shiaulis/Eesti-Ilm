name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftFormat lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Show SwiftFormat version
        run: swiftformat --version
      - name: Lint
        run: swiftformat --lint .

  build-and-test:
    name: Build and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
