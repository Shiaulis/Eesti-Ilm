# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  commit_status: true
  fail_commit_status: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["master"]
  path_filters:
    - "!**/Package.resolved"
    - "!Gemfile.lock"
    - "!**/*.xcassets/**"
  path_instructions:
    - path: "**/*.swift"
      instructions: >-
        Swift 6 language mode with strict concurrency, minimum iOS 27.
        SwiftFormat with the repo's .swiftformat is the only style authority: do not comment on formatting or naming style.
        Focus on correctness, concurrency safety, error handling and API design. New tests use Swift Testing.
    - path: "**/*.xcodeproj/**"
      instructions: >-
        The project file is project.xcproj in Xcode's JSON project format (Xcode 27+), not project.pbxproj.
        It is JSON5-like (comments and trailing commas are valid), so do not flag them and do not suggest strict-JSON tooling such as jq.
        Target and product "id" values are referenced by the shared schemes and the test plan, so flag changes to them.
        Check deployment targets stay at iOS 27.0 and signing stays automatic. Do not suggest Xcode UI-only changes.
    - path: ".github/workflows/**"
      instructions: "CI runs on the GitHub-hosted xcode-27 image with Xcode 27.2 selected explicitly. Commands must match AGENTS.md."
    - path: "fastlane/metadata/**"
      instructions: >-
        App Store Connect metadata, locale en-US only (App Store Connect has no Estonian).
        Limits: name and subtitle 30 characters, keywords 100, promotional text 170, description 4000.
    - path: "**/*.md"
      instructions: "Docs must match the actual commands, file paths and versions in the repo."
  tools:
    swiftlint:
      enabled: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns: ["AGENTS.md"]
chat:
  auto_reply: true
